name: Pinned Modelica Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: rcp benchmark-setup
      - run: rcp benchmark-validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelica-validation-artifacts
          path: data/runs/validation-*/
          if-no-files-found: ignore
